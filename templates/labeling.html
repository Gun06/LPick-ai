<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>LP 이미지 레이블링 도구</title>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            margin: 0;
            padding: 20px;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
        }
        
        .container {
            max-width: 1200px;
            margin: 0 auto;
            background: white;
            border-radius: 15px;
            box-shadow: 0 20px 40px rgba(0,0,0,0.1);
            overflow: hidden;
        }
        
        .header {
            background: linear-gradient(135deg, #ff6b6b, #ee5a24);
            color: white;
            padding: 30px;
            text-align: center;
        }
        
        .header h1 {
            margin: 0;
            font-size: 2.5em;
            font-weight: 300;
        }
        
        .header p {
            margin: 10px 0 0 0;
            opacity: 0.9;
            font-size: 1.1em;
        }
        
        .main-content {
            display: flex;
            min-height: 600px;
        }
        
        .image-section {
            flex: 2;
            padding: 30px;
            background: #f8f9fa;
        }
        
        .controls-section {
            flex: 1;
            padding: 30px;
            background: white;
            border-left: 1px solid #e9ecef;
        }
        
        .image-container {
            text-align: center;
            margin-bottom: 30px;
        }
        
        .image-container img {
            max-width: 100%;
            max-height: 500px;
            border-radius: 10px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.2);
            transition: transform 0.3s ease;
        }
        
        .image-container img:hover {
            transform: scale(1.02);
        }
        
        .image-info {
            background: white;
            padding: 20px;
            border-radius: 10px;
            margin-bottom: 20px;
            box-shadow: 0 5px 15px rgba(0,0,0,0.1);
        }
        
        .image-info h3 {
            margin: 0 0 15px 0;
            color: #2c3e50;
        }
        
        .info-item {
            display: flex;
            justify-content: space-between;
            margin-bottom: 8px;
            padding: 5px 0;
            border-bottom: 1px solid #ecf0f1;
        }
        
        .info-item:last-child {
            border-bottom: none;
        }
        
        .info-label {
            font-weight: 600;
            color: #7f8c8d;
        }
        
        .info-value {
            color: #2c3e50;
        }
        
        .label-buttons {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 15px;
            margin-bottom: 30px;
        }
        
        .label-btn {
            padding: 20px;
            border: none;
            border-radius: 10px;
            font-size: 1.1em;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s ease;
            text-transform: uppercase;
            letter-spacing: 1px;
        }
        
        .label-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 10px 25px rgba(0,0,0,0.2);
        }
        
        .label-btn:active {
            transform: translateY(0);
        }
        
        .front-btn {
            background: linear-gradient(135deg, #74b9ff, #0984e3);
            color: white;
        }
        
        .back-btn {
            background: linear-gradient(135deg, #fd79a8, #e84393);
            color: white;
        }
        
        .inner-btn {
            background: linear-gradient(135deg, #fdcb6e, #e17055);
            color: white;
        }
        
        .disk-btn {
            background: linear-gradient(135deg, #6c5ce7, #a29bfe);
            color: white;
        }
        
        .action-buttons {
            display: flex;
            flex-direction: column;
            gap: 15px;
        }
        
        .action-btn {
            padding: 15px;
            border: 2px solid #ddd;
            border-radius: 10px;
            background: white;
            color: #2c3e50;
            font-size: 1em;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s ease;
        }
        
        .action-btn:hover {
            background: #f8f9fa;
            border-color: #74b9ff;
        }
        
        .skip-btn {
            border-color: #e17055;
            color: #e17055;
        }
        
        .skip-btn:hover {
            background: #e17055;
            color: white;
        }
        
        .prev-btn {
            border-color: #74b9ff;
            color: #74b9ff;
        }
        
        .prev-btn:hover {
            background: #74b9ff;
            color: white;
        }
        
        .stats {
            background: #f8f9fa;
            padding: 20px;
            border-radius: 10px;
            margin-top: 30px;
        }
        
        .stats h3 {
            margin: 0 0 15px 0;
            color: #2c3e50;
        }
        
        .stat-item {
            display: flex;
            justify-content: space-between;
            margin-bottom: 8px;
            padding: 5px 0;
        }
        
        .progress-bar {
            width: 100%;
            height: 20px;
            background: #ecf0f1;
            border-radius: 10px;
            overflow: hidden;
            margin: 20px 0;
        }
        
        .progress-fill {
            height: 100%;
            background: linear-gradient(135deg, #74b9ff, #0984e3);
            transition: width 0.3s ease;
        }
        
        .loading {
            text-align: center;
            padding: 50px;
            color: #7f8c8d;
        }
        
        .message {
            padding: 15px;
            border-radius: 10px;
            margin-bottom: 20px;
            font-weight: 600;
        }
        
        .success {
            background: #d4edda;
            color: #155724;
            border: 1px solid #c3e6cb;
        }
        
        .error {
            background: #f8d7da;
            color: #721c24;
            border: 1px solid #f5c6cb;
        }
        
        .finished {
            text-align: center;
            padding: 50px;
            color: #2c3e50;
        }
        
        .finished h2 {
            color: #27ae60;
            margin-bottom: 20px;
        }
        
        @media (max-width: 768px) {
            .main-content {
                flex-direction: column;
            }
            
            .label-buttons {
                grid-template-columns: 1fr;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>🎵 LP 이미지 레이블링</h1>
            <p>앞면, 뒤면, 속지, LP판을 구분하여 레이블링하세요</p>
        </div>
        
        <div class="main-content">
            <div class="image-section">
                <div id="loading" class="loading">
                    <h3>이미지를 로딩 중...</h3>
                </div>
                
                <div id="image-container" class="image-container" style="display: none;">
                    <img id="current-image" src="" alt="현재 이미지">
                </div>
                
                <div id="image-info" class="image-info" style="display: none;">
                    <h3>📁 이미지 정보</h3>
                    <div class="info-item">
                        <span class="info-label">파일명:</span>
                        <span class="info-value" id="image-name">-</span>
                    </div>
                    <div class="info-item">
                        <span class="info-label">크기:</span>
                        <span class="info-value" id="image-size">-</span>
                    </div>
                    <div class="info-item">
                        <span class="info-label">모드:</span>
                        <span class="info-value" id="image-mode">-</span>
                    </div>
                </div>
                
                <div id="finished" class="finished" style="display: none;">
                    <h2>🎉 모든 이미지 레이블링 완료!</h2>
                    <p>훌륭한 작업이었습니다!</p>
                </div>
            </div>
            
            <div class="controls-section">
                <div id="message"></div>
                
                <div class="label-buttons">
                    <button class="label-btn front-btn" onclick="labelImage('front')">
                        🎨 앞면<br><small>Front Cover</small>
                    </button>
                    <button class="label-btn back-btn" onclick="labelImage('back')">
                        📄 뒤면<br><small>Back Cover</small>
                    </button>
                    <button class="label-btn inner-btn" onclick="labelImage('inner')">
                        📖 속지<br><small>Inner Sleeve</small>
                    </button>
                    <button class="label-btn disk-btn" onclick="labelImage('disk')">
                        💿 LP판<br><small>Disk</small>
                    </button>
                </div>
                
                <div class="action-buttons">
                    <button class="action-btn skip-btn" onclick="skipImage()">
                        ⏭️ 건너뛰기
                    </button>
                    <button class="action-btn prev-btn" onclick="previousImage()">
                        ⬅️ 이전 이미지
                    </button>
                </div>
                
                <div class="stats">
                    <h3>📊 진행 상황</h3>
                    <div class="stat-item">
                        <span>현재 이미지:</span>
                        <span id="current-index">-</span>
                    </div>
                    <div class="stat-item">
                        <span>남은 이미지:</span>
                        <span id="remaining-count">-</span>
                    </div>
                    <div class="stat-item">
                        <span>레이블링 완료:</span>
                        <span id="labeled-count">-</span>
                    </div>
                    <div class="progress-bar">
                        <div class="progress-fill" id="progress-fill"></div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script>
        let currentImageData = null;
        
        // 페이지 로드 시 첫 번째 이미지 로드
        window.onload = function() {
            loadCurrentImage();
        };
        
        // 현재 이미지 로드
        async function loadCurrentImage() {
            try {
                const response = await fetch('/api/current_image');
                const data = await response.json();
                
                if (data.success) {
                    currentImageData = data;
                    displayImage(data);
                    updateStats(data);
                    hideLoading();
                } else if (data.finished) {
                    showFinished();
                } else {
                    showMessage('이미지 로드 실패: ' + data.message, 'error');
                }
            } catch (error) {
                showMessage('네트워크 오류: ' + error.message, 'error');
            }
        }
        
        // 이미지 표시
        function displayImage(data) {
            const imageContainer = document.getElementById('image-container');
            const imageInfo = document.getElementById('image-info');
            const currentImage = document.getElementById('current-image');
            
            currentImage.src = data.image_base64;
            document.getElementById('image-name').textContent = data.image_name;
            document.getElementById('image-size').textContent = 
                `${data.image_info.width} × ${data.image_info.height}`;
            document.getElementById('image-mode').textContent = data.image_info.mode;
            
            imageContainer.style.display = 'block';
            imageInfo.style.display = 'block';
        }
        
        // 통계 업데이트
        function updateStats(data) {
            document.getElementById('current-index').textContent = data.current_index;
            document.getElementById('remaining-count').textContent = data.total_unlabeled;
            document.getElementById('labeled-count').textContent = data.total_labeled;
            
            // 진행률 바 업데이트
            const progress = (data.total_labeled / (data.total_labeled + data.total_unlabeled)) * 100;
            document.getElementById('progress-fill').style.width = progress + '%';
        }
        
        // 로딩 숨기기
        function hideLoading() {
            document.getElementById('loading').style.display = 'none';
        }
        
        // 완료 화면 표시
        function showFinished() {
            document.getElementById('loading').style.display = 'none';
            document.getElementById('image-container').style.display = 'none';
            document.getElementById('image-info').style.display = 'none';
            document.getElementById('finished').style.display = 'block';
        }
        
        // 메시지 표시
        function showMessage(text, type) {
            const messageDiv = document.getElementById('message');
            messageDiv.textContent = text;
            messageDiv.className = 'message ' + type;
            messageDiv.style.display = 'block';
            
            setTimeout(() => {
                messageDiv.style.display = 'none';
            }, 3000);
        }
        
        // 이미지 레이블링
        async function labelImage(label) {
            try {
                const response = await fetch('/api/label_image', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                    },
                    body: JSON.stringify({ label: label })
                });
                
                const data = await response.json();
                
                if (data.success) {
                    showMessage(data.message, 'success');
                    loadCurrentImage(); // 다음 이미지 로드
                } else {
                    showMessage('레이블링 실패: ' + data.message, 'error');
                }
            } catch (error) {
                showMessage('네트워크 오류: ' + error.message, 'error');
            }
        }
        
        // 이미지 건너뛰기
        async function skipImage() {
            try {
                const response = await fetch('/api/skip_image', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                    }
                });
                
                const data = await response.json();
                
                if (data.success) {
                    showMessage(data.message, 'success');
                    loadCurrentImage(); // 다음 이미지 로드
                } else {
                    showMessage('건너뛰기 실패: ' + data.message, 'error');
                }
            } catch (error) {
                showMessage('네트워크 오류: ' + error.message, 'error');
            }
        }
        
        // 이전 이미지로 이동
        async function previousImage() {
            try {
                const response = await fetch('/api/previous_image', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                    }
                });
                
                const data = await response.json();
                
                if (data.success) {
                    showMessage(data.message, 'success');
                    loadCurrentImage(); // 이전 이미지 로드
                } else {
                    showMessage('이전 이미지로 이동 실패: ' + data.message, 'error');
                }
            } catch (error) {
                showMessage('네트워크 오류: ' + error.message, 'error');
            }
        }
        
        // 키보드 단축키
        document.addEventListener('keydown', function(event) {
            switch(event.key) {
                case '1':
                    labelImage('front');
                    break;
                case '2':
                    labelImage('back');
                    break;
                case '3':
                    labelImage('inner');
                    break;
                case '4':
                    labelImage('disk');
                    break;
                case 's':
                case 'S':
                    skipImage();
                    break;
                case 'ArrowLeft':
                    previousImage();
                    break;
            }
        });
    </script>
</body>
</html>
